[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bckg"
version = "0.1.0"
description = "Neo4j knowledge graph of Business Central products"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["neo4j>=5.20", "PyYAML>=6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
bckg = "bckg.cli:main"

[tool.setuptools]
packages = ["bckg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
