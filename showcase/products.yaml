# The public showcase: Business Central apps whose repositories are public.
# Built by .github/workflows/showcase.yml (on changes to main, or by hand) and published to https://graph.dmom.ai
products:
  - name: Commerce
    description: Headless commerce on Business Central - a storefront and domain services, an Azure integration layer and an AL connector, joined by versioned OpenAPI and AsyncAPI contracts.
    repos:
      - name: commerce-platform
        github: sta-ko-je-reko-ja-sam-reko/commerce-platform
        contracts: [packages/contracts]
      - name: commerce-integration
        github: sta-ko-je-reko-ja-sam-reko/commerce-integration
      - name: commerce-connector-bc
        github: sta-ko-je-reko-ja-sam-reko/commerce-connector-bc
  - name: Warehouse Advanced
    description: Advanced warehouse management for Business Central Cloud, beyond the standard app.
    repos:
      - name: warehouse-advanced-bc
        github: sta-ko-je-reko-ja-sam-reko/warehouse-advanced-bc
  - name: Construction Management
    description: A construction vertical on standard Business Central Projects - estimating, cost control, scheduling, progress billing, retention, subcontracts and plant.
    repos:
      - name: bc-construction-management
        github: sta-ko-je-reko-ja-sam-reko/bc-construction-management
  - name: CRM
    description: Native CRM in Business Central - record ownership and teams, an activity timeline, opportunities, a guided sales process, a product catalog and pricing, with no Dataverse.
    repos:
      - name: bc-native-crm
        github: sta-ko-je-reko-ja-sam-reko/bc-native-crm
  - name: Invoice Forge
    description: High-volume invoice import and batch posting - a Rust ingestion service and an AL extension that posts through Business Central's supported APIs.
    repos:
      - name: bc-invoice-forge
        github: sta-ko-je-reko-ja-sam-reko/bc-invoice-forge
  - name: Dataverse Integration Redesign
    description: Microsoft's Dataverse, Dynamics 365 Sales and Field Service integration redesigned around swappable interfaces instead of hard-wired event subscribers - one handler per integration table mapping, from the sync engine to the page actions.
    repos:
      - name: bc-dataverse-integration-redesign
        github: sta-ko-je-reko-ja-sam-reko/bc-dataverse-integration-redesign
  - name: Manufacturing Advanced
    description: Guardrails and capabilities for Business Central manufacturing - release pre-flight checks, WIP control and G/L reconciliation, refresh protection, standard cost drift, planning insight, a shop floor terminal, engineering change orders and finite loading.
    repos:
      - name: manufacturing-advanced-bc
        github: sta-ko-je-reko-ja-sam-reko/manufacturing-advanced-bc
# Features whose src folder cannot be guessed from their name (nested folders allowed).
feature_folders:
  "CRM:FEAT-ACT-001": Dataverse/Activities
  "CRM:FEAT-OWN-001": Dataverse/Ownership
  "CRM:FEAT-PTY-001": Dataverse/PartyEnrichment
  "CRM:FEAT-OPP-001": CRM/Opportunity
  "CRM:FEAT-BPF-001": CRM/Process
  "CRM:FEAT-RC-001": CRM/RoleCenter
  "Construction Management:FEAT-EST-001": Estimating
  "Construction Management:FEAT-RC-001": Core/RoleCenter
